name: Build HomeFit APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack project ZIP if uploaded to repository root
        run: |
          if [ -f HomeFit-Android-Project.zip ]; then
            unzip -q -o HomeFit-Android-Project.zip -d /tmp/homefit-project
            cp -R /tmp/homefit-project/HomeFit-Android/. .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeFit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
